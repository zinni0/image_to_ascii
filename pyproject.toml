[project]
name = "image-to-ascii"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zinni0", email = "142218244+zinni0@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
]

[project.scripts]
image-to-ascii = "image_to_ascii.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
exclude-newer = "3 days"
